services:
  db:
    image: docker.io/library/mysql:8.4
    container_name: barbearia-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root123}
      MYSQL_DATABASE: ${DB_NAME:-barbearia}
      MYSQL_USER: ${DB_USER:-barbearia}
      MYSQL_PASSWORD: ${DB_PASS:-root123}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: barbearia-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html:Z
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-barbearia}
      DB_PASS: ${DB_PASS:-root123}
      DB_NAME: ${DB_NAME:-barbearia}

  phpmyadmin:
    image: docker.io/phpmyadmin:latest
    container_name: barbearia-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M

volumes:
  db_data:
